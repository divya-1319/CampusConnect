
<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>CampusConnect</h1>
        <p>Admin Login</p>

        <form action="/login" method="POST">
            <input
                type="password"
                name="password"
                placeholder="Enter Admin Password"
                required
            >

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
